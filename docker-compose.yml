version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: astranex_postgres
    environment:
      POSTGRES_USER: astranex_user
      POSTGRES_PASSWORD: astranex_secure_db_password_98723!
      POSTGRES_DB: astranex_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U astranex_user -d astranex_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: astranex_redis
    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: astranex_backend
    environment:
      DATABASE_URL: postgresql://astranex_user:astranex_secure_db_password_98723!@postgres:5432/astranex_db
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: astranex-prod-super-secret-key-32chars-minimum!
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: astranex_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: astranex_nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
